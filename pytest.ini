[pytest]
# research/ holds the paper's material and the frozen first-generation
# pipeline (see research/README.md); it has no tests and is never collected.
testpaths = tests
norecursedirs = research .* build __pycache__
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# NeMo Guardrails 0.24.1 raises two DeprecationWarnings of its own (no current
# event loop, and its jailbreak rail's nim_base_url field) hundreds of times;
# every other DeprecationWarning is shown.
filterwarnings =
    ignore::DeprecationWarning:nemoguardrails
    ignore::pytest.PytestDeprecationWarning

addopts = --cov=aegisshield --cov=main --cov-branch --cov-report=xml --cov-config=.coveragerc
