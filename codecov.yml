coverage:
  status:
    project:
      default:
        target: 75%
        threshold: 1%
    patch:
      default:
        target: 90%
        threshold: 1%

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  require_base: no
  require_head: yes

# Coverage is measured for aegisshield/ and main.py only (see .coveragerc);
# research/ holds the paper's material and the frozen first-generation pipeline.
ignore:
  - "research/**"
  - "tests/**"
  - "tools/**"
