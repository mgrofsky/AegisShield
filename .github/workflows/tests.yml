name: Tests
permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
    # Each action is pinned to a full commit SHA; the comment names its release.
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}

    # tshark so the real-binary PCAP tests run. Every Python requirement
    # installs from a prebuilt wheel, so no compiler or Cairo is needed.
    - name: Install system packages
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
        sudo apt-get install -y --no-install-recommends tshark

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt

    - name: Lint
      run: ruff check .

    # Known vulnerabilities in the pinned requirements and everything they
    # bring, from the Python Packaging Advisory Database and OSV.
    - name: Audit dependencies
      run: |
        pip install pip-audit==2.10.1
        pip-audit -r requirements.txt -r requirements-dev.txt --progress-spinner off

    - name: Run tests
      run: |
        rm -f .coverage
        pytest

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: mgrofsky/AegisShield
