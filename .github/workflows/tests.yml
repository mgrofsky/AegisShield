name: Tests
permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
    # Each action is pinned to a full commit SHA; the comment names its release.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    # tshark so the real-binary PCAP tests run. Every Python requirement
    # installs from a prebuilt wheel, so no compiler or Cairo is needed.
    - name: Install system packages
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
        sudo apt-get install -y --no-install-recommends tshark

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt

    - name: Lint
      run: ruff check .

    # Known vulnerabilities in the pinned requirements and everything they
    # bring, from the Python Packaging Advisory Database and OSV.
    - name: Audit dependencies
      run: |
        pip install pip-audit==2.10.1
        pip-audit -r requirements.txt -r requirements-dev.txt --progress-spinner off

    - name: Run tests
      run: |
        rm -f .coverage
        pytest

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: mgrofsky/AegisShield
